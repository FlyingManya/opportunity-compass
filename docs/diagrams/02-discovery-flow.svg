    </defs>
    <rect width="1600" height="900" fill="url(#bg)"/>
    <circle cx="1510" cy="52" r="200" fill="#f1e8ff" opacity=".72"/>
    <circle cx="54" cy="844" r="194" fill="#ffeadd" opacity=".55"/>
    <rect x="0" y="0" width="1600" height="12" fill="url(#top)"/>
    <rect x="72" y="42" width="205" height="36" rx="18" fill="#ece5fb"/><text x="174.5" y="67" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7556bf">OPPORTUNITY COMPASS</text>
    <text x="72" y="138" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#25213b">From a goal to a dashboard card</text>
    <text x="73" y="180" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#6c6683">Muse Wonder researches; the server checks and stores; React displays</text>
    
    
    <g filter="url(#shadow)"><rect x="72" y="226" width="438" height="218" rx="28" fill="#e5efff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="96" y="249" width="9" height="172" rx="5" fill="#5682bd"/>
    <text x="128" y="279" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#5682bd">01 / USER CONTEXT</text>
    <g transform="translate(426,245)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#5682bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="17" r="9"/><path d="M9 44c2-11 9-17 16-17s14 6 16 17"/></g></g>
    <text x="128" y="327" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Profile + search brief</text>
    <text x="128" y="368" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Interests, skills, trusted sites</text><text x="128" y="397" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Optional résumé sharing</text><text x="128" y="426" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Keyword cache supports source leads</text>
    
    <g filter="url(#shadow)"><rect x="581" y="226" width="438" height="218" rx="28" fill="#ede6ff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="605" y="249" width="9" height="172" rx="5" fill="#7556bf"/>
    <text x="637" y="279" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#7556bf">02 / RESEARCH</text>
    <g transform="translate(935,245)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#7556bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="14"/><path d="m33 33 11 11M17 22h10m-5-5v10"/></g></g>
    <text x="637" y="327" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Muse Wonder 1.0</text>
    <text x="637" y="368" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Question + chosen context + date</text><text x="637" y="397" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Meta web_search finds pages</text><text x="637" y="426" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Returns structured candidates</text>
    
    <g filter="url(#shadow)"><rect x="1090" y="226" width="438" height="218" rx="28" fill="#ffe6d6" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="1114" y="249" width="9" height="172" rx="5" fill="#c16b54"/>
    <text x="1146" y="279" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#c16b54">03 / CANDIDATE FIELDS</text>
    <g transform="translate(1444,245)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#c16b54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="36" height="38" rx="5"/><path d="M15 17h20M15 25h20M15 33h13"/></g></g>
    <text x="1146" y="327" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Structured results</text>
    <text x="1146" y="368" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Title • organizer • description</text><text x="1146" y="397" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Source URL • reason it matches</text><text x="1146" y="426" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Deadline, or blank if unknown</text>
    
    <path d="M522,330 L569,330" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1031,330 L1078,330" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1309,456 L1309,530" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1078,647 L1031,647" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M569,647 L522,647" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <g filter="url(#shadow)"><rect x="1090" y="540" width="438" height="223" rx="28" fill="#fff1cc" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="1114" y="563" width="9" height="177" rx="5" fill="#b47731"/>
    <text x="1146" y="593" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#b47731">04 / SERVER CHECKS</text>
    <g transform="translate(1444,559)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#b47731" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="11" width="36" height="34" rx="5"/><path d="M7 21h36M17 6v10m16-10v10M16 30h6m7 0h6m-19 7h6"/></g></g>
    <text x="1146" y="641" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Validate + deduplicate</text>
    <text x="1146" y="682" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">URL must match search sources</text><text x="1146" y="711" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Reject known past deadlines</text><text x="1146" y="740" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Keep useful undated leads</text>
    
    <g filter="url(#shadow)"><rect x="581" y="540" width="438" height="223" rx="28" fill="#e5f4e9" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="605" y="563" width="9" height="177" rx="5" fill="#429267"/>
    <text x="637" y="593" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#429267">05 / ACCOUNT-SCOPED</text>
    <g transform="translate(935,559)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#429267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="25" cy="12" rx="16" ry="6"/><path d="M9 12v27c0 8 32 8 32 0V12 M9 25c0 8 32 8 32 0"/></g></g>
    <text x="637" y="641" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">MongoDB entries</text>
    <text x="637" y="682" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">discovered_opportunities</text><text x="637" y="711" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">One user’s records; up to 20</text><text x="637" y="740" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Saved separately from sample cards</text>
    
    <g filter="url(#shadow)"><rect x="72" y="540" width="438" height="223" rx="28" fill="#ffffff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="96" y="563" width="9" height="177" rx="5" fill="#7556bf"/>
    <text x="128" y="593" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#7556bf">06 / RENDER</text>
    <g transform="translate(426,559)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#7556bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="38" height="33" rx="5"/><path d="M6 18h38M12 13h2m6 0h2m-9 13h13m-13 7h19"/></g></g>
    <text x="128" y="641" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Reusable card template</text>
    <text x="128" y="682" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">React reads stored records</text><text x="128" y="711" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Same layout for every result</text><text x="128" y="740" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Open a card for deeper research</text>
    
    <text x="800" y="811" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7556bf">Wonder receives consented profile context directly; cached keywords help source-lead matching.</text>

