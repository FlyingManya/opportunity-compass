<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Deadlines, calendar, and refresh">
    <defs>
      <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9f6ff"/><stop offset=".56" stop-color="#fffaf6"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
      <linearGradient id="top" x2="1" y2="0"><stop stop-color="#7f62c4"/><stop offset="1" stop-color="#f2a984"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#5b4c84" flood-opacity=".10"/></filter>
      <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M1,1 L11,6.5 L1,12" fill="none" stroke="#7556bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <rect width="1600" height="900" fill="url(#bg)"/>
    <circle cx="1510" cy="52" r="200" fill="#f1e8ff" opacity=".72"/>
    <circle cx="54" cy="844" r="194" fill="#ffeadd" opacity=".55"/>
    <rect x="0" y="0" width="1600" height="12" fill="url(#top)"/>
    <rect x="72" y="42" width="205" height="36" rx="18" fill="#ece5fb"/><text x="174.5" y="67" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7556bf">OPPORTUNITY COMPASS</text>
    <text x="72" y="138" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#25213b">Deadlines, calendar, and refresh</text>
    <text x="73" y="180" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#6c6683">Missing dates remain visible; known expired opportunities are removed</text>
    
    
    <g filter="url(#shadow)"><rect x="72" y="231" width="438" height="220" rx="28" fill="#e5efff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="96" y="254" width="9" height="174" rx="5" fill="#5682bd"/>
    <text x="128" y="284" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#5682bd">DATE UNKNOWN</text>
    <g transform="translate(426,250)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#5682bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="36" height="38" rx="5"/><path d="M15 17h20M15 25h20M15 33h13"/></g></g>
    <text x="128" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Keep the opportunity</text>
    <text x="128" y="373" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Card says deadline not mentioned</text><text x="128" y="402" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">No invented application date</text><text x="128" y="431" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">User can still inspect its source</text>
    
    <g filter="url(#shadow)"><rect x="581" y="231" width="438" height="220" rx="28" fill="#ede6ff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="605" y="254" width="9" height="174" rx="5" fill="#7556bf"/>
    <text x="637" y="284" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#7556bf">ON DEMAND</text>
    <g transform="translate(935,250)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#7556bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="14"/><path d="m33 33 11 11M17 22h10m-5-5v10"/></g></g>
    <text x="637" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Recheck or enter date</text>
    <text x="637" y="373" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Muse Wonder searches again</text><text x="637" y="402" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Or user enters a verified date</text><text x="637" y="431" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">No bulk deadline API calls</text>
    
    <g filter="url(#shadow)"><rect x="1090" y="231" width="438" height="220" rx="28" fill="#fff1cc" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="1114" y="254" width="9" height="174" rx="5" fill="#b47731"/>
    <text x="1146" y="284" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#b47731">KNOWN DATE</text>
    <g transform="translate(1444,250)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#b47731" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="11" width="36" height="34" rx="5"/><path d="M7 21h36M17 6v10m16-10v10M16 30h6m7 0h6m-19 7h6"/></g></g>
    <text x="1146" y="332" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Validate against today</text>
    <text x="1146" y="373" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Use the user’s timezone</text><text x="1146" y="402" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Past date → remove record</text><text x="1146" y="431" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Future date → keep card</text>
    
    <path d="M522,340 L569,340" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1031,340 L1078,340" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1309,463 L1309,540" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M522,652 L569,652" fill="none" stroke="#7556bf" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    
    <g filter="url(#shadow)"><rect x="72" y="546" width="438" height="220" rx="28" fill="#ffe6d6" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="96" y="569" width="9" height="174" rx="5" fill="#c16b54"/>
    <text x="128" y="599" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#c16b54">USER CHOICE</text>
    <g transform="translate(426,565)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#c16b54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="17" r="9"/><path d="M9 44c2-11 9-17 16-17s14 6 16 17"/></g></g>
    <text x="128" y="647" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Mark Interested</text>
    <text x="128" y="688" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Save the chosen opportunity</text><text x="128" y="717" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Can save even without a date</text><text x="128" y="746" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Known dates go to calendar</text>
    
    <g filter="url(#shadow)"><rect x="581" y="546" width="438" height="220" rx="28" fill="#e5f4e9" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="605" y="569" width="9" height="174" rx="5" fill="#429267"/>
    <text x="637" y="599" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#429267">PLAN</text>
    <g transform="translate(935,565)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#429267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="11" width="36" height="34" rx="5"/><path d="M7 21h36M17 6v10m16-10v10M16 30h6m7 0h6m-19 7h6"/></g></g>
    <text x="637" y="647" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">In-app calendar</text>
    <text x="637" y="688" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Shows saved application dates</text><text x="637" y="717" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Export .ics for other calendars</text><text x="637" y="746" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">No direct Google sync</text>
    
    <g filter="url(#shadow)"><rect x="1090" y="546" width="438" height="220" rx="28" fill="#ffffff" stroke="#ded8eb" stroke-width="2"/></g>
    <rect x="1114" y="569" width="9" height="174" rx="5" fill="#7556bf"/>
    <text x="1146" y="599" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#7556bf">SERVER CLEANUP</text>
    <g transform="translate(1444,565)"><circle cx="25" cy="25" r="26" fill="#ffffff" opacity=".72"/><g fill="none" stroke="#7556bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M39 18a16 16 0 1 0 2 17M39 18v-9m0 9h-9M17 25l6 6 11-13"/></g></g>
    <text x="1146" y="647" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#25213b">Refresh dashboard</text>
    <text x="1146" y="688" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Delete known expired records</text><text x="1146" y="717" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Clean researched + saved data</text><text x="1146" y="746" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#6c6683">Show up to 20 current cards</text>
    
    <text x="800" y="813" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#7556bf">Muse Wonder finds dates; server code validates and deletes. Undated cards stay until reviewed.</text>

    <rect x="72" y="847" width="1456" height="1.5" fill="#ded8e9"/>
    <text x="72" y="878" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#6c6683">SYSTEM DIAGRAM  /  README</text>
